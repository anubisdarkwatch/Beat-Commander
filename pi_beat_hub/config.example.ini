# Beat Hub config. Edit, then: sudo systemctl restart beat-hub

[gateway]
# "auto" finds the Beat Gateway by its USB name. Or set it: /dev/ttyACM0 (Pi), COM9 (Windows)
port = auto

[link]
# Ableton Link: every Link app on the same network follows the conductor's tempo and bar.
enabled = true
# Beats per bar
quantum = 4

[osc]
# Where to send OSC, comma separated host:port. Empty = no OSC.
# e.g. targets = 192.168.1.50:7000, 127.0.0.1:9000
targets =
# Messages: <prefix> <beat 1-4> <bpm>   <prefix>/1 .. <prefix>/4   <prefix>/bpm <bpm>   <prefix>/bar <count>
prefix = /beat

[web]
# Live page + JSON at http://<this-machine>:<port>/api/state (TrackID reads this)
enabled = true
port = 8090

[timing]
# Shift the beat later (+) or earlier (-) in milliseconds, if your lights or app sit a little off the music
offset_ms = 0
